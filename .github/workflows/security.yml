name: Segurança & Qualidade

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tipos (tsc --noEmit)
        run: npx tsc --noEmit

      # Catraca em vez de `|| true`: o nº de erros pode cair, nunca subir.
      # Ligar como gate puro falharia em todo commit (63 erros hoje), e CI
      # sempre vermelho é CI ignorado. Teto em scripts/ci/lint-teto.json.
      - name: Lint (catraca — não pode piorar)
        run: node scripts/ci/lint-catraca.mjs

      # A falha que já apareceu DUAS vezes (jul e ago/26): função
      # `security definer` executável pelo anônimo, ignorando RLS.
      # Sem os secrets a checagem avisa e passa — ver o script.
      - name: RPCs security definer fechadas ao anônimo (gate)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: node scripts/ci/checa-rpc-anon.mjs

      - name: Dependências — vulnerabilidades CRÍTICAS (gate)
        run: npm audit --audit-level=critical

      - name: Dependências — high (informativo, não bloqueia)
        run: npm audit --audit-level=high || true

      - name: Scan de segredos (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1
